[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tickforge-community"
version = "0.1.0"
description = "Simulation-first, safety-oriented trading framework for learning and research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "k1everwann" }]
keywords = ["trading", "simulation", "backtesting", "risk-management", "taiwan-futures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
tickforge = "tickforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tickforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Safety suites group their cases as `<Module>Tests` classes, one per module.
python_classes = ["Test*", "*Tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
